<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Cache-Control" content="no-cache">
<meta http-equiv="Expires" content="Thu, 01 Dec 1994 16:00:00 GMT">
<title>出勤希望日確認画面</title>
<link rel="stylesheet" media="all" th:href="@{/css/common.css}" />
<link rel="stylesheet" media="all" th:href="@{/css/workRequestCheck.css}" />
<script type="text/javascript" th:src="@{/js/common.js}"></script>
<script type="text/javascript" th:src="@{/js/message.js}"></script>
</head>

<!-- 【クラス付加】cyber-page を追加 -->
<body class="cyber-page">
	<!-- 【クラス付加】cyber-outer-frame を追加 -->
	<div id="wrapper" class="cyber-outer-frame" style="padding: 10px">
		<div id="header">
			<!-- centered-container→ full-widthに変更  障害No.21 川面 7/31-->
			<table class="full-width">
				<tr>
					<td id="headLeft">
						<form action="/kikin/menu" method="post">
							<!-- 【クラス付加】btn-cyber-nav を追加 -->
							<input value="戻る" type="submit" class="smallButton btn-cyber-nav" />
						</form>
					</td>
					<!-- 【クラス付加】cyber-title を追加 -->
					<td id="headCenter" class="cyber-title">出勤希望確認</td>
					<!-- 【クラス付加】btn-cyber-nav を追加 -->
					<td id="headRight"><input value="ログアウト" type="button"
						class="smallButton btn-cyber-nav" onclick="logout()" /></td>
				</tr>
			</table>
		</div>
		<!--  障害票No.021 田渕 2026/8/7 -->
		<!-- div class="search"を追記 -->
		<!--No026 東國原 検索のボタンがなくても検索できるように修正 -->
		<!-- 【クラス付加】cyber-search-bar を追加 -->
		<div class="search cyber-search-bar" style="text-align: center; display: flex; justify-content: center; align-items: center; gap: 20px;">
			<form id="searchForm" action="/kikin/workDateRequestCheck/search"
				method="post" th:object="${workDateRequestCheckForm}">

				<!-- 【クラス付加】cyber-label を追加 -->
				<label class="cyber-label">表示年月：</label>
				<!-- 【クラス付加】cyber-select を追加 -->
				<select th:name="yearMonth" id="yearMonth" class="cyber-select"
					onchange="document.getElementById('searchForm').submit();">
					<option th:each="yearMonth : ${yearMonthValues}"
						th:value="${yearMonth}" th:selected="${yearMonth} == *{yearMonth}"
						th:inline="text" inputmode="text">[[${yearMonth}]]</option>
				</select>
			</form>
			<!--No026 東國原 ページング機能を追加 -->
			<!-- 【クラス付加】cyber-pagination を追加 -->
			<div th:if="${resWorkDateRequestLogics != null && #lists.size(resWorkDateRequestLogics) != 0}" class="cyber-pagination">
				<span th:if="${workDateRequestPage.isFirst()}">前へ</span>
				<a th:unless="${workDateRequestPage.isFirst()}"
					th:href="@{/kikin/workDateRequestCheck/search(page = ${workDateRequestPage.getNumber() - 1})}">前へ</a>
					
				<span th:if="${workDateRequestPage.isLast()}">次へ</span>
				<a th:unless="${workDateRequestPage.isLast()}"
					th:href="@{/kikin/workDateRequestCheck/search(page = ${workDateRequestPage.getNumber() + 1})}">次へ</a>
				<span th:text="| ${workDateRequestPage.getNumber() + 1} / ${workDateRequestPage.getTotalPages()}|"></span>
			</div>
			
		</div>

		<!--<br>追加  障害No.21 川面 7/31 -->
		<br>

		<!-- id→ classに変更  障害No.21 川面 7/31-->
		<!-- 【クラス付加】cyber-table-container を追加 -->
		<div class="businessBody cyber-table-container">
			<!-- 【クラス付加】cyber-table を追加 -->
			<table class="daysTable cyber-table">
				<thead style="display: block; position: sticky;">
					<tr class="tableHeader">
						<td style="width: 150px; text-align: center;">&nbsp;</td>
						<td th:each="dateBean : ${datebeanList}"
							style="width: 40px; text-align: center;"><span
							th:value="${dateBeanStat.count}">[[${dateBeanStat.count}]]</span>
						</td>
					</tr>
					<tr class="tableHeader">
						<td style="width: 150px; text-align: center; white-space: nowrap;">
							社員名</td>
						<td th:each="dateBean : ${datebeanList}"
							style="width: 40px; text-align: center; vertical-align: middle;">
							<span
							th:if="${dateBean.weekDay == saturday && !dateBean.publicHolidayFlg}"
							th:value="${dateBean.weekDay}" style="color: blue;">[[${dateBean.weekDay}]]</span>
							
						<!-- 障害No.16  寺松 日曜日が赤色になるように修正 -->
							<span
							th:if="${dateBean.weekDay == '日' || dateBean.publicHolidayFlg}"
							th:value="${dateBean.weekDay}" style="color: red;">[[${dateBean.weekDay}]]</span>
							<span
							th:unless="${dateBean.weekDay == saturday || dateBean.weekDay == '日' || dateBean.publicHolidayFlg}"
							th:value="${dateBean.weekDay}" style="color: black;">[[${dateBean.weekDay}]]</span>
						<!-- ここまで sundayの表記を全て'日'にした -->
						</td>
					</tr>
				</thead>
				<!--No014 東國原 ${resWorkDateRequestLogics} → ${workDateRequestCheckBeanList}
								workRequest1 → symbol01に修正（ページング済みの内容を表示するため）
								max-height: 400px; → 500pxに修正（要素が被るため） -->
				<tbody
					style="display: block; max-height: 500px;">
					<!-- 【クラス付加】cyber-row を追加 -->
					<tr
						th:each="workDateRequestCheck : ${resWorkDateRequestLogics}"
						class="tableBody cyber-row">
						<td class="tableBody" style="width: 150px; text-align: center;">
							<span th:value="${workDateRequestCheck.employeeName}">[[${workDateRequestCheck.employeeName}]]</span>
						</td>
						<td class="tableBody" style="width: 40px; text-align: center;"
							th:text="${workDateRequestCheck.workRequest1}"></td>
						<td class="tableBody" style="width: 40px; text-align: center;"
							th:text="${workDateRequestCheck.workRequest2}"></td>
						<td class="tableBody" style="width: 40px; text-align: center;"
							th:text="${workDateRequestCheck.workRequest3}"></td>
						<td class="tableBody" style="width: 40px; text-align: center;"
							th:text="${workDateRequestCheck.workRequest4}"></td>
						<td class="tableBody" style="width: 40px; text-align: center;"
							th:text="${workDateRequestCheck.workRequest5}"></td>
						<td class="tableBody" style="width: 40px; text-align: center;"
							th:text="${workDateRequestCheck.workRequest6}"></td>
						<td class="tableBody" style="width: 40px; text-align: center;"
							th:text="${workDateRequestCheck.workRequest7}"></td>
						<td class="tableBody" style="width: 40px; text-align: center;"
							th:text="${workDateRequestCheck.workRequest8}"></td>
						<td class="tableBody" style="width: 40px; text-align: center;"
							th:text="${workDateRequestCheck.workRequest9}"></td>
						<td class="tableBody" style="width: 40px; text-align: center;"
							th:text="${workDateRequestCheck.workRequest10}"></td>
						<td class="tableBody" style="width: 40px; text-align: center;"
							th:text="${workDateRequestCheck.workRequest11}"></td>
						<td class="tableBody" style="width: 40px; text-align: center;"
							th:text="${workDateRequestCheck.workRequest12}"></td>
						<td class="tableBody" style="width: 40px; text-align: center;"
							th:text="${workDateRequestCheck.workRequest13}"></td>
						<td class="tableBody" style="width: 40px; text-align: center;"
							th:text="${workDateRequestCheck.workRequest14}"></td>
						<td class="tableBody" style="width: 40px; text-align: center;"
							th:text="${workDateRequestCheck.workRequest15}"></td>
						<td class="tableBody" style="width: 40px; text-align: center;"
							th:text="${workDateRequestCheck.workRequest16}"></td>
						<td class="tableBody" style="width: 40px; text-align: center;"
							th:text="${workDateRequestCheck.workRequest17}"></td>
						<td class="tableBody" style="width: 40px; text-align: center;"
							th:text="${workDateRequestCheck.workRequest18}"></td>
						<td class="tableBody" style="width: 40px; text-align: center;"
							th:text="${workDateRequestCheck.workRequest19}"></td>
						<td class="tableBody" style="width: 40px; text-align: center;"
							th:text="${workDateRequestCheck.workRequest20}"></td>
						<td class="tableBody" style="width: 40px; text-align: center;"
							th:text="${workDateRequestCheck.workRequest21}"></td>
						<td class="tableBody" style="width: 40px; text-align: center;"
							th:text="${workDateRequestCheck.workRequest22}"></td>
						<td class="tableBody" style="width: 40px; text-align: center;"
							th:text="${workDateRequestCheck.workRequest23}"></td>
						<td class="tableBody" style="width: 40px; text-align: center;"
							th:text="${workDateRequestCheck.workRequest24}"></td>
						<td class="tableBody" style="width: 40px; text-align: center;"
							th:text="${workDateRequestCheck.workRequest25}"></td>
						<td class="tableBody" style="width: 40px; text-align: center;"
							th:text="${workDateRequestCheck.workRequest26}"></td>
						<td class="tableBody" style="width: 40px; text-align: center;"
							th:text="${workDateRequestCheck.workRequest27}"></td>
						<td class="tableBody" style="width: 40px; text-align: center;"
							th:text="${workDateRequestCheck.workRequest28}"></td>
						<td th:if="${datebeanList.size() > 28}" class="tableBody"
							style="width: 40px; text-align: center;"
							th:text="${workDateRequestCheck.workRequest29}"></td>
						<td th:if="${datebeanList.size() > 29}" class="tableBody"
							style="width: 40px; text-align: center;"
							th:text="${workDateRequestCheck.workRequest30}"></td>
						<td th:if="${datebeanList.size() > 30}" class="tableBody"
							style="width: 40px; text-align: center;"
							th:text="${workDateRequestCheck.workRequest31}"></td>
					</tr>
				</tbody>
			</table>
		</div>
		
		<!-- ★ ここに画像を追加 ★ -->
		<div class="pixel-characters-container">
			<!-- 画像パス（例: /images/characters.png など）に合わせて src を書き換えてください -->
			<img th:src="@{/images/characters.png}" alt="ドット絵キャラクター" class="pixel-characters-img" />
		</div>
		
	</div>
</body>
<footer>
			<table>
				<tr>
					<td>
						<div style="margin-left: 50px;">
							<!--  障害票No.027 田渕 2026/8/6 -->
							<!-- <input value="凡例表示" type="button" class="longButton"  onclick="openWindo()" /> -->
							<!-- ↑修正前コード -->
							<!-- ↓修正後コード -->
							<!-- 【クラス付加】btn-cyber-nav を追加 -->
							<input value="凡例表示" type="button" class="longButton btn-cyber-nav"  onclick="openWindow()" />
						</div>
					</td>
				</tr>
			</table>
</footer>
</html>
