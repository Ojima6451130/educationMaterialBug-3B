<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Cache-Control" content="no-cache">
  <meta http-equiv="Expires" content="Thu, 01 Dec 1994 16:00:00 GMT">
<link rel="stylesheet" media="all" th:href="@{/css/common.css}" />
<link rel="stylesheet" media="all" th:href="@{/css/employeeMstMnt.css}" />
  <script type="text/javascript" th:src="@{/js/common.js}"></script>
  <script type="text/javascript" th:src="@{/js/message.js}"></script>
  <script type="text/javascript" th:src="@{/js/checkCommon.js}"></script>
  <title>社員マスタメンテナンス画面（新規登録）</title>
  <script>
    /**
     * 新規登録画面へ
     */
    function employeeMstMntRegister() {

      with (document.forms['registForm']) {
        // パスワード
        var passwordVar = password.value;
        // 社員名カナ
        var employeeNameKanaVar = employeeNameKana.value;
        // エラーメッセージ
        var errorMsg = '';

        // 背景色をクリアする
        password.style.backgroundColor = 'rgba(0, 15, 8, 0.95)';
        employeeNameKana.style.backgroundColor = 'rgba(0, 15, 8, 0.95)';

        // パスワード
        if (!checkRequired(passwordVar)) {
          // エラー有り
          var strArr = ['パスワード'];
          errorMsg += getMessage('E-MSG-000001', strArr);
          password.style.backgroundColor = 'rgba(255, 0, 85, 0.5)';
        }

        // 社員名カナ
        if (!checkHalfWidthKana(employeeNameKanaVar)) {
          // エラー有り
          var strArr = ['社員名カナ'];
          errorMsg += getMessage('E-MSG-000003', strArr);
          employeeNameKana.style.backgroundColor = 'rgba(255, 0, 85, 0.5)';
        }

        if (errorMsg) {
          alert(errorMsg);
          // エラー
          return false;
        }
      }
    }
  </script>
</head>

<body class="cyber-page">
  <div id="wrapper">
    <!-- サイバー大型外枠 -->
    <div class="cyber-outer-frame">
      <!-- 四隅のアタッチメント -->
      <div class="corner corner-top-left"></div>
      <div class="corner corner-top-right"></div>
      <div class="corner corner-bottom-left"></div>
      <div class="corner corner-bottom-right"></div>

      <!-- ヘッダーエリア -->
      <div id="header">
        <div class="header-nav-left">
          <form action="/kikin/employeeMstMnt" method="post">
            <input value="← 戻る" type="submit" class="btn-cyber-nav" />
          </form>
        </div>

        <div class="header-nav-center">
          <div class="cyber-sub-title">DATABASE // NEW REGISTRATION</div>
          <h1 class="cyber-glitch-title">社員マスタメンテナンス (新規登録)</h1>
        </div>

        <div class="header-nav-right" style="text-align: right;">
          <form action="/kikin/eMstMntRegisterBack" method="post">
            <input value="ログアウト" type="button" class="btn-cyber-nav" onclick="logout()" />
          </form>
        </div>
      </div>

      <!-- メインフォームエリア -->
      <div id="businessBody">
        <form id="registForm" action="/kikin/employeeMstMntRegister" method="post">
          <div class="table-container">
            <table class="cyber-table">
              <thead class="tableHeader">
                <tr>
                  <th style="width: 180px;">パスワード</th>
                  <th style="width: 220px;">社員名</th>
                  <th style="width: 220px;">社員名カナ</th>
                  <th style="width: 130px;">権限</th>
                </tr>
              </thead>
              <tbody class="tableBody">
                <tr>
                  <td style="width: 180px;">
                    <input type="password" name="password" class="cyber-input" />
                  </td>
                  <td style="width: 220px;">
                    <input type="text" name="employeeName" class="cyber-input" />
                  </td>
                  <td style="width: 220px;">
                    <input type="text" name="employeeNameKana" class="cyber-input" />
                  </td>
                  <td style="width: 130px;">
                    <select name="authorityId" class="cyber-select">
                      <option value="01">管理者</option>
                      <option value="02">一般</option>
                    </select>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </form>

        <!-- フッターアクションボタン -->
        <div class="cyber-footer-actions">
          <input value="登録" type="submit" class="btn-cyber-action" form="registForm" onclick="return employeeMstMntRegister()" />
        </div>
      </div>

    </div>
  </div>
</body>

</html>
